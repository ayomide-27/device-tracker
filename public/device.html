<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>FO Tracker</title>
  <link rel="stylesheet" href="/css/device.css" />
</head>
<body>
  <main class="app">
    <!-- Screen 1: set up -->
    <section id="setup" class="card">
      <h1>FO Tracker</h1>
      <p class="sub">
        This work phone shares its GPS location with your employer's tracker, only while sharing is on.
        You can stop at any time.
      </p>
      <p class="message" id="setupMessage" hidden></p>
      <label for="label">Name for this device</label>
      <input id="label" type="text" maxlength="60" placeholder="e.g. FO Chidi" autocomplete="off" />
      <div id="keyRow" hidden>
        <label for="key">Access code</label>
        <input id="key" type="password" autocomplete="off" placeholder="Given by your supervisor" />
      </div>
      <button id="startBtn" type="button">Start sharing</button>
      <p class="note" id="leftover" hidden></p>
    </section>

    <!-- Screen 2: sharing -->
    <div id="running" hidden>
      <section class="card">
        <div class="state"><span class="dot" id="dot"></span><span id="stateText">Starting…</span></div>
        <dl>
          <dt>Last GPS reading</dt><dd id="lastFix">—</dd>
          <dt>Waiting to upload</dt><dd id="pending">—</dd>
          <dt>Last upload</dt><dd id="lastUpload">—</dd>
        </dl>
      </section>

      <section class="card">
        <h2>Sites this week</h2>
        <p class="note" id="planMeta"></p>
        <ul class="list" id="siteList"></ul>
        <button class="secondary" id="otherBtn" type="button">Check in at another place</button>
      </section>

      <section class="card">
        <h2>Today's check-ins</h2>
        <p class="note" id="todayEmpty">None yet.</p>
        <ul class="list" id="todayList"></ul>
      </section>

      <p class="note" id="hint"></p>
      <button class="secondary" id="stopBtn" type="button">Stop sharing</button>
    </div>
  </main>

  <!-- Check-in pop-up -->
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-body">
      <h2 id="sheetTitle">Check in</h2>
      <div id="otherRow" hidden>
        <label for="placeName">Place name</label>
        <input id="placeName" type="text" maxlength="80" placeholder="e.g. Mama Ngozi shop, Wuse" autocomplete="off" />
      </div>
      <div class="state"><span class="dot" id="gpsDot"></span><span id="gpsText"></span></div>
      <p class="note" id="distanceText"></p>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
      <button class="secondary" id="photoBtn" type="button">Add photo (optional)</button>
      <img id="photoPreview" class="preview" alt="Photo to attach" hidden />
      <p class="note error-text" id="photoError"></p>
      <button id="confirmBtn" type="button" disabled>Check in</button>
      <button class="secondary" id="cancelBtn" type="button">Cancel</button>
    </div>
  </div>

  <script type="module" src="/js/device/main.js"></script>
</body>
</html>
